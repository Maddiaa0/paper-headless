[package]
name = "paper-headless"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Run Paper Desktop on a headless Linux server so its local MCP server is available to agents"
license = "MIT"
repository = "https://github.com/Maddiaa0/paper-headless"
homepage = "https://github.com/Maddiaa0/paper-headless"
readme = "README.md"
exclude = [".claude/", ".github/"]
keywords = ["paper", "mcp", "headless", "xvfb", "agents"]
categories = ["command-line-utilities", "development-tools"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
unwrap_used = "allow"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
nix = { version = "0.31", default-features = false, features = ["signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = { version = "0.3", default-features = false }
thiserror = "2"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
ureq = { version = "3.3", default-features = false }

[profile.dist]
inherits = "release"
lto = "thin"
