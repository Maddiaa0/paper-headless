# Tag `vX.Y.Z` to publish static Linux binaries that install.sh downloads.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          name=paper-headless-${GITHUB_REF_NAME}-${{ matrix.target }}
          tar -czf "$name.tar.gz" -C target/${{ matrix.target }}/release paper-headless
          sha256sum "$name.tar.gz" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: paper-headless-*
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: cat *.sha256 > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            paper-headless-*.tar.gz
            SHA256SUMS
